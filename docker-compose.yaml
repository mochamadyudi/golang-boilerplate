version: '3'

services:
  dev:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    image: dev_yuyuid
    container_name: CORE.yuyuid.id
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - dev_yuyuid:/var/opt/srv_yuyuid
    networks:
      - dev_yuyuid_net
  prod:
    build:
      context: .
      dockerfile: ./prod.dockerfile
    restart: always
    ports:
      - "5002:5002"

volumes:
  dev_yuyuid:
    driver: local
networks:
  dev_yuyuid_net:
    driver: bridge
